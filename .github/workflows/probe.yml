name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://gamma-api.polymarket.com
          for q in "spain" "sanchez" "feijoo" "spain%20prime%20minister" "abascal"; do
            curl -s "$G/public-search?q=$q&limit_per_type=50&events_status=active" | python3 -c "
          import json,sys
          for e in json.load(sys.stdin).get('events',[]):
            if 'constituency' in (e.get('slug') or '') and 'vox' not in e['slug']: continue
            print(e.get('slug'),'|',e.get('title'),'|',round(float(e.get('volume') or 0)),'|',len(e.get('markets') or []))"
          done | sort -u
