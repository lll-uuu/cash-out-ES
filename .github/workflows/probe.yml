name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          cat > p.py <<'PY'
          import json,os,urllib.request,time,collections,datetime as dt
          K=os.environ['K']; print('key set:', bool(K))
          W={'A':'0x0a1b3e0cf66d6d45c9c98b947dacbcb65f900979','B':'0xe102b1da4367d827b48c47ea91fadf6997ff71df','C':'0x9efda3d6354152901fc4706c3b1a9ce50b45ad00','D':'0x1ee9a5fc09665909c0cce297c581703bfbb9197f'}
          inv={v:k for k,v in W.items()}
          sh=lambda a: inv.get(a.lower(), a[:8]+'…')
          for k,w in W.items():
            u=f'https://api.etherscan.io/v2/api?chainid=137&module=account&action=tokentx&address={w}&startblock=0&endblock=99999999&sort=asc&apikey={K}'
            r=json.load(urllib.request.urlopen(u)); time.sleep(0.4)
            if r.get('status')!='1': print(k,'ERR',r.get('message'),str(r.get('result'))[:120]); continue
            ins=collections.defaultdict(lambda:[0,0,None]); outs=collections.defaultdict(lambda:[0,0,None])
            for t in r['result']:
              v=int(t['value'])/10**int(t['tokenDecimal']); ts=int(t['timeStamp'])
              if t['tokenSymbol'] not in ('USDC','USDC.e','pUSD','USDT','DAI'): continue
              d=ins if t['to'].lower()==w else outs; o=t['from'] if d is ins else t['to']
              e=d[(o.lower(),t['tokenSymbol'])]; e[0]+=v; e[1]+=1; e[2]=e[2] or ts
            print(f'== {k}: first tx', dt.datetime.utcfromtimestamp(int(r['result'][0]['timeStamp'])).isoformat() if r['result'] else '-')
            for (o,sym),(v,n,ts) in sorted(ins.items(),key=lambda x:-x[1][0])[:6]: print('  IN ',sh(o),sym,round(v),'x',n,'first',dt.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d %H:%M'))
            for (o,sym),(v,n,ts) in sorted(outs.items(),key=lambda x:-x[1][0])[:4]: print('  OUT',sh(o),sym,round(v),'x',n)
          PY
          python3 p.py
