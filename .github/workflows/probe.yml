name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://gamma-api.polymarket.com
          for q in "spain%20general%20election" "spain%20vox" "spain%20election%20seats"; do
            curl -s "$G/public-search?q=$q&limit_per_type=50&events_status=active" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for e in d.get('events',[]): print(e.get('slug'),'|',e.get('title'),'|',round(float(e.get('volume') or 0)),'|',len(e.get('markets') or []))"
          done | sort -u
          for s in spain-general-election-pp-vox-majority spain-general-election-vox-of-vote spain-general-election-vox-of-seats; do
            echo "=== $s"; curl -s "$G/events?slug=$s" | python3 -c "
          import json,sys
          for e in json.load(sys.stdin):
            print(e['title'], e.get('volume'))
            for m in e['markets']: print('  ', m.get('groupItemTitle') or m.get('question'), m.get('conditionId'), m.get('outcomePrices'), m.get('volume'))"
          done
