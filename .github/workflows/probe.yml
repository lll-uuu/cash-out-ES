name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          cat > p.py <<'PY'
          import json,os,urllib.request,time,collections,datetime as dt
          K=os.environ['K']; w='0xdbbbde184ab04018ce0373c0dbe4e5fd6be805a8'
          u=f'https://api.etherscan.io/v2/api?chainid=137&module=account&action=tokentx&address={w}&startblock=0&endblock=99999999&sort=asc&apikey={K}'
          r=json.load(urllib.request.urlopen(u))['result']
          print('first tx', dt.datetime.utcfromtimestamp(int(r[0]['timeStamp'])).isoformat(), 'n', len(r))
          ins=collections.defaultdict(lambda:[0,0,None]); outs=collections.defaultdict(lambda:[0,0,None])
          for t in r:
            if t['tokenSymbol'] not in ('USDC','USDC.e','pUSD','USDT'): continue
            v=int(t['value'])/10**int(t['tokenDecimal']); ts=int(t['timeStamp'])
            d,o=(ins,t['from']) if t['to'].lower()==w else (outs,t['to'])
            e=d[(o.lower()[:8],t['tokenSymbol'])]; e[0]+=v; e[1]+=1; e[2]=e[2] or ts
          for (o,s),(v,n,ts) in sorted(ins.items(),key=lambda x:-x[1][0])[:8]: print(' IN ',o,s,round(v),'x',n,dt.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d %H:%M'))
          for (o,s),(v,n,ts) in sorted(outs.items(),key=lambda x:-x[1][0])[:6]: print(' OUT',o,s,round(v),'x',n,dt.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d %H:%M'))
          for t in r:
            ts=int(t['timeStamp'])
            if 1762900000<=ts<=1763100000 and t['tokenSymbol'] in ('USDC','USDC.e','pUSD'):
              v=int(t['value'])/10**int(t['tokenDecimal'])
              if v>500: print(' near 12/11:', dt.datetime.utcfromtimestamp(ts).strftime('%m-%d %H:%M'), 'IN' if t['to'].lower()==w else 'OUT', (t['from'] if t['to'].lower()==w else t['to'])[:8], round(v))
          PY
          python3 p.py
          curl -s "https://data-api.polymarket.com/v2/activity?user=0xdbbbde184ab04018ce0373c0dbe4e5fd6be805a8&limit=500" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin)['data']; c=collections.Counter(); u=collections.Counter()
          for a in d: c[(a.get('event_slug') or a.get('slug') or '')[:50]]+=1; u[(a.get('event_slug') or a.get('slug') or '')[:50]]+=float(a.get('usdc_size') or 0)
          print('activity rows',len(d)); [print('  ',k,c[k],round(u[k])) for k,_ in u.most_common(12)]
          for a in d[:40]:
            if 'spain' in str(a.get('event_slug')) or 'spain' in str(a.get('slug')): print('   ',a.get('timestamp'),a.get('type'),a.get('side'),a.get('outcome'),a.get('title','')[:40],a.get('usdc_size'),a.get('price'))"
