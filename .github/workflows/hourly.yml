name: Cash Out España hourly

# GitHub's scheduled runs are best-effort and often skip hours. So each run stays alive for
# about five hours, marbling at the start of every hour (scripts/relay.sh), then starts the
# next run itself. The hourly schedule stays as a backup that restarts the chain if it ever breaks.
# The last frame is 20:00 UTC on 29 November 2026, when the Canary Islands close their polls
# (21:00 in Madrid). After that, runs do nothing and the chain stops.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write      # to start the next run in the chain

concurrency:
  group: cash-out-hourly
  cancel-in-progress: false

jobs:
  marble:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Marble every hour for five hours
        run: bash scripts/relay.sh
      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node -e 'process.exit(Date.now() > Date.parse(require("./lib").CONFIG.finalAt) ? 0 : 1)'; then
            echo "polls closed; the chain ends here"; exit 0
          fi
          gh workflow run hourly.yml --ref main -R "$GITHUB_REPOSITORY"
